<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Areg's Birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #D9CDBF;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
  }

  /* ── SPLASH ── */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #EAD9C5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  #splash.hiding {
    opacity: 0;
    pointer-events: none;
  }

  .splash-balloons {
    position: relative;
    width: 260px;
    height: 320px;
    margin-bottom: 32px;
  }

  .splash-balloon {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    animation: splashRise linear infinite;
    opacity: 0;
  }

  .splash-balloon:nth-child(1) {
    width: 100px;
    animation-duration: 7s;
    animation-delay: 0s;
    left: 40%;
  }
  .splash-balloon:nth-child(2) {
    width: 70px;
    animation-duration: 9s;
    animation-delay: 2s;
    left: 65%;
    animation-name: splashRiseSway;
  }
  .splash-balloon:nth-child(3) {
    width: 55px;
    animation-duration: 8s;
    animation-delay: 1.2s;
    left: 20%;
    animation-name: splashRiseSway2;
  }

  .splash-star {
    position: absolute;
    opacity: 0;
    animation: starTwinkle ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes starTwinkle {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50%       { opacity: 0.85; transform: scale(1) rotate(20deg); }
  }

  @keyframes splashRise {
    0%   { bottom: -180px; opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { bottom: 110%; opacity: 0; }
  }

  @keyframes splashRiseSway {
    0%   { bottom: -180px; opacity: 0; transform: translateX(-50%) rotate(-4deg); }
    10%  { opacity: 0.85; }
    50%  { transform: translateX(-40%) rotate(3deg); }
    80%  { opacity: 0.85; }
    100% { bottom: 110%; opacity: 0; transform: translateX(-60%) rotate(-4deg); }
  }

  @keyframes splashRiseSway2 {
    0%   { bottom: -180px; opacity: 0; transform: translateX(-50%) rotate(3deg); }
    10%  { opacity: 0.7; }
    50%  { transform: translateX(-60%) rotate(-3deg); }
    80%  { opacity: 0.7; }
    100% { bottom: 110%; opacity: 0; transform: translateX(-40%) rotate(3deg); }
  }

  .splash-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(58px, 16vw, 80px);
    color: #648997;
    letter-spacing: 10px;
    margin-bottom: 10px;
    text-align: center;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-left: 10px;
  }

  .splash-subtitle {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(22px, 6vw, 30px);
    color: #7A7060;
    letter-spacing: 1px;
    margin-bottom: 40px;
    text-align: center;
  }

  .splash-tap {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    color: #B0A090;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: tapPulse 2s ease-in-out infinite;
  }

  @keyframes tapPulse {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }

  .splash-divider {
    width: 48px;
    height: 1px;
    background: linear-gradient(to right, transparent, #C9A96E, transparent);
    margin: 0 auto 20px;
  }

  body.splash-open { overflow: hidden; }

  .splash-btn {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: #648997;
    border: none;
    border-radius: 50px;
    padding: 16px 36px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .splash-btn:hover { background: #8AAAB0; }

  .card {
    background: #EAD9C5;
    width: 100%;
    max-width: 480px;
    border-radius: 4px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.12), 0 2px 12px rgba(0,0,0,0.07);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── TOP DECORATION ── */
  .top-deco {
    position: relative;
    width: 100%;
    height: 280px;
    overflow: hidden;
    border-radius: 4px 4px 0 0;
  }

  .cloud-left {
    position: absolute;
    top: 60px;
    left: 12px;
    width: 41%;
    opacity: 0.9;
    pointer-events: none;
    animation: floatCloud 7s ease-in-out infinite;
  }

  .cloud-right {
    position: absolute;
    top: 40px;
    right: -98px;
    width: 59%;
    opacity: 0.85;
    pointer-events: none;
    animation: floatCloudR 6s ease-in-out infinite 1.5s;
  }

  .hot-balloon {
    position: absolute;
    top: -62px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    max-width: 210px;
    pointer-events: none;
    z-index: 2;
    filter: drop-shadow(0 10px 20px rgba(100,120,130,0.2));
    animation: floatBalloon 5s ease-in-out infinite;
  }

  @keyframes floatBalloon {
    0%, 100% { transform: translateX(-50%) translateY(0px); }
    50%       { transform: translateX(-50%) translateY(-10px); }
  }
  @keyframes floatCloud {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-6px); }
  }
  @keyframes floatCloudR {
    0%, 100% { transform: scaleX(-1) translateY(0px); }
    50%       { transform: scaleX(-1) translateY(-8px); }
  }
  @keyframes floatCar {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }
  @keyframes floatBouquet {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50%       { transform: translateY(-8px) rotate(1deg); }
  }

  /* ── TEXT BODY ── */
  .text-body {
    text-align: center;
    padding: 10px 32px 0;
    width: 100%;
  }

  .label-join {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    color: #000000;
    letter-spacing: 2.5px;
    margin-bottom: 16px;
  }

  .name {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(52px, 14vw, 64px);
    font-weight: 400;
    color: #648997;
    letter-spacing: 10px;
    line-height: 1;
    margin-bottom: 14px;
  }

  .subtitle {
    display: block;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 400;
    font-style: normal;
    color: #4B4B4B;
    letter-spacing: 0.5px;
    margin-bottom: 26px;
  }

  .divider {
    display: block;
    width: 56px;
    height: 1px;
    background: linear-gradient(to right, transparent, #C9A96E, transparent);
    margin: 0 auto 22px;
  }

  .event-title {
    display: block;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: #648997;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .details {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    color: #6A6460;
    letter-spacing: 1.2px;
    line-height: 1.8;
    margin-bottom: 12px;
  }

  .details .sep { color: #C9A96E; margin: 0 10px; }

  .invite-msg {
    display: block;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #6A6460;
    line-height: 1.75;
    margin-bottom: 80px;
    letter-spacing: 0.3px;
  }

  .info-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    margin-bottom: 22px;
    border: 1px solid rgba(201,169,110,0.35);
    border-radius: 6px;
    overflow: hidden;
  }

  .info-row {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    gap: 0;
    background: rgba(255,255,255,0.18);
    border-bottom: 1px solid rgba(201,169,110,0.2);
  }

  .info-row:last-child {
    border-bottom: none;
  }

  .info-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 16px;
  }

  .info-icon svg { width: 18px; height: 18px; }

  .info-label {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #9A8E7E;
    white-space: nowrap;
    min-width: 52px;
    letter-spacing: 0.5px;
  }

  .info-sep {
    width: 1px;
    height: 18px;
    background: linear-gradient(to bottom, transparent, #C9A96E, transparent);
    margin: 0 16px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  .info-value {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #3A3028;
    letter-spacing: 0.3px;
  }

  /* ── RSVP ── */
  .rsvp-section {
    width: 100%;
    padding: 0 24px 32px;
    box-sizing: border-box;
  }

  .rsvp-title {
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #648997;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 16px;
  }

  .rsvp-card {
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(201,169,110,0.35);
    border-radius: 6px;
    padding: 22px 20px;
  }

  .rsvp-radio-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .rsvp-radio-label {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 50px;
    padding: 12px 18px;
    cursor: pointer;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: #5A5248;
    transition: background 0.2s, border-color 0.2s;
  }

  .rsvp-radio-label:hover { background: rgba(201,169,110,0.1); border-color: #C9A96E; }
  .rsvp-radio-label.selected { background: rgba(167,188,192,0.15); border-color: #648997; color: #3A3028; }
  .rsvp-radio-label input[type=radio] { display: none; }

  .rsvp-radio-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(201,169,110,0.5);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    position: relative;
  }

  .rsvp-radio-label.selected .rsvp-radio-dot { border-color: #648997; background: #648997; }
  .rsvp-radio-label.selected .rsvp-radio-dot::after { content: ''; display: block; width: 7px; height: 7px; border-radius: 50%; background: #fff; }

  .rsvp-divider { border: none; border-top: 1px solid rgba(201,169,110,0.25); margin: 4px 0 18px; }

  .rsvp-field-label {
    display: block;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #9A8E7E;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .rsvp-input, .rsvp-textarea {
    width: 100%;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    color: #3A3028;
    background: linear-gradient(120deg, rgba(255,255,255,0.55) 0%, rgba(201,169,110,0.08) 40%, rgba(167,188,192,0.1) 60%, rgba(255,255,255,0.55) 100%);
    background-size: 200% 200%;
    animation: inputSparkle 4s ease-in-out infinite;
    border: 1px solid rgba(201,169,110,0.3);
    border-radius: 6px;
    padding: 11px 14px;
    outline: none;
    box-sizing: border-box;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  @keyframes inputSparkle {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .rsvp-input:focus, .rsvp-textarea:focus { border-color: #648997; }
  .rsvp-textarea { height: 80px; resize: none; }

  .rsvp-submit {
    width: 100%;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: #648997;
    border: none;
    border-radius: 50px;
    padding: 14px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }

  .rsvp-submit:hover { background: #8AAAB0; }

  .rsvp-success {
    display: none;
    text-align: center;
    padding: 16px 8px;
    font-family: ui-rounded, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    color: #5A6A60;
    line-height: 1.65;
  }

  .rsvp-success-icon { display: block; margin-bottom: 12px; }

  /* ── BOTTOM ILLUSTRATION ── */
  .bottom-illo {
    position: relative;
    width: 100%;
    height: 320px;
    margin-top: 0;
    overflow: visible;
    border-radius: 0 0 4px 4px;
    isolation: isolate;
  }

  .balloon-bouquet {
    bottom: 60px;
    left: 0%;
    width: 44%;
    animation: floatBouquet 5.5s ease-in-out infinite 1s;
  }

  .bear-car {
    position: absolute;
    bottom: 0;
    right: 3%;
    width: 88%;
    pointer-events: none;
    animation: floatCar 4.5s ease-in-out infinite 0.5s;
  }
</style>
</head>

<!-- SPLASH -->
<div id="splash">
  <!-- stars -->
  <img class="splash-star" src="image 232.png" style="width:28px;top:12%;left:14%;animation-duration:2.8s;animation-delay:0s;">
  <img class="splash-star" src="image 234.png" style="width:22px;top:18%;left:78%;animation-duration:3.5s;animation-delay:0.6s;">

  </div>

  <!-- RSVP -->
  <div class="rsvp-section">

    <div class="rsvp-card">
      <form id="rsvpForm" onsubmit="return false;">
        <div class="rsvp-radio-group">
          <label class="rsvp-radio-label" onclick="rsvpSelect(this)">
            <input type="radio" name="attendance" value="Կգամ" required>
            <span class="rsvp-radio-dot"></span>
            <span>Այո, կգամ</span>
          </label>
          <label class="rsvp-radio-label" onclick="rsvpSelect(this)">
            <input type="radio" name="attendance" value="Չեմ կարողանա">

            <span>Ցավոք, չեմ կարողանա</span>
          </label>
        </div>
        <hr class="rsvp-divider">
        <label class="rsvp-field-label">Անուն և Ազգանուն</label>
        <input class="rsvp-input" type="text" name="name" placeholder="Ձեր անունը" required>
        <label class="rsvp-field-label">Ավելացված հյուրեր</label>
        <textarea class="rsvp-textarea" name="guests" placeholder="Խնդրում ենք նշել անունները"></textarea>
        <button type="submit" class="rsvp-submit">Ուղարկել</button>
      </form>
      <div class="rsvp-success" id="rsvpSuccess">
        <span class="rsvp-success-icon">

<script>
function openInvitation() {
  var sp = document.getElementById('splash');
  sp.classList.add('hiding');
  setTimeout(function() { sp.style.display = 'none'; }, 800);
  document.body.classList.remove('splash-open');
}

function rsvpSelect(el) {
  document.querySelectorAll('.rsvp-radio-label').forEach(function(l) { l.classList.remove('selected'); });
  el.classList.add('selected');
  el.querySelector('input[type=radio]').checked = true;
}

var TG_BOT_TOKEN = '8877019872:AAG4eKpy0HPqM_pjQwqBsR4PovnhL_Ugwos';
var TG_CHAT_ID   = '-5334675589';

document.getElementById('rsvpForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var data = new FormData(this);
  var attendance = data.get('attendance') || '';
  var name       = (data.get('name') || '').trim();
  var guests     = (data.get('guests') || '').trim();
  var msg = '🎈 ԱՐԵԳԻ 2-ԱՄՅԱԿ — Հյուր\n\n'
          + '👤 Անուն: ' + (name || '—') + '\n'
          + '✅ ' + attendance
          + (guests ? '\n👥 Հյուրեր: ' + guests : '');
  fetch('https://api.telegram.org/bot' + TG_BOT_TOKEN + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg })
  }).then(function(res) {
    if (res.ok) {
      document.getElementById('rsvpForm').style.display = 'none';
      var s = document.getElementById('rsvpSuccess');
      s.style.display = 'block';
      s.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else { alert('Խնդիր առաջացավ։ Փորձե՛ք կրկին։'); }
  }).catch(function() { alert('Կապի խնդիր։ Ստուգե՛ք ինտերնետը։'); });
});
</script>
